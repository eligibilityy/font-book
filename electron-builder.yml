# Placeholder: replace with a reverse-DNS id you control, e.g. com.yourname.book.
# macOS uses it to tell apps apart, so keep it stable once she has installed one.
appId: studio.yiliya.book
productName: Book
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!vitest.config.{js,ts,mts,mjs,cjs}"
  - "!{dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,bun.lock}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # Tooling and docs never ship inside the app.
  - "!{biome.jsonc,knip.json,.dependency-cruiser.cjs,commitlint.config.cjs,.gitattributes}"
  - "!{AGENTS.md,CLAUDE.md,CONTEXT.md,CONTRIBUTING.md}"
  - "!{docs,tools,.husky,.github,.claude}/**/*"
asarUnpack:
  - resources/**
win:
  executableName: book
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # No Apple Developer ID: ad-hoc sign ("-") so Apple Silicon will launch the
  # arm64 binary. Ad-hoc signing needs hardenedRuntime off. No notarization.
  identity: "-"
  hardenedRuntime: false
  notarize: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Book reads font files you keep in Documents.
    NSDownloadsFolderUsageDescription: Book reads font files you keep in Downloads.
    NSDesktopFolderUsageDescription: Book reads font files you keep on the Desktop.
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
