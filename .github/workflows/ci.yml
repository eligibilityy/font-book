name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Node runs the tools (electron-vite, tsc, electron-builder); Bun installs
      # packages and runs the scripts. bun.lock is the lock file.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, boundaries, unused code, tests
        run: bun run check

      # Catches bundling errors that typecheck misses. Packaging happens only
      # in release.yml, on the real target OS.
      - name: Build
        run: bun run build
